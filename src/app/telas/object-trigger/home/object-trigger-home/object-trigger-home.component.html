<header class="page-header">
  <div class="flex align-items-center gap-3 min-w-0">
    <a class="pagina__voltar flex flex-shrink-0 align-items-center justify-content-center w-2rem h-2rem border-round-sm no-underline" routerLink="/object-trigger" [attr.aria-label]="'portal.generic.label.triggers' | translate">
      <span class="pi pi-chevron-left text-base" aria-hidden="true"></span>
    </a>

    <div class="flex flex-column min-w-0">
      <span class="t-label-field pagina__objeto">{{ 'portal.generic.label.trigger' | translate }}</span>
      @if (carregando) {
        <p-skeleton width="320px" height="24px" aria-hidden="true" />
      } @else if (gatilho) {
        <h1 class="page-header__title min-w-0 overflow-hidden text-overflow-ellipsis white-space-nowrap">{{ gatilho.descricao }}</h1>
      }
    </div>
  </div>
</header>

<!-- Ações da página: à direita, abaixo do cabeçalho e acima dos campos -->
@if (!carregando && gatilho) {
  <div class="page-header__actions justify-content-end pt-3 px-5">
    @if (editando) {
      <button
        pButton
        type="button"
        class="btn--md btn--secondary"
        [label]="'portal.generic.button.cancel' | translate"
        [disabled]="salvando"
        (click)="cancelar()"
      ></button>
      <button
        pButton
        type="button"
        class="btn--md btn--primary"
        [label]="'portal.generic.button.save' | translate"
        [loading]="salvando"
        [disabled]="!podeSalvar"
        (click)="salvar()"
      ></button>
    } @else {
      <button
        pButton
        type="button"
        icon="pi pi-pencil"
        class="btn--md btn--primary"
        [label]="'portal.generic.button.edit' | translate"
        (click)="editar()"
      ></button>
    }
  </div>
}

@if (!carregando && !gatilho) {
  <div class="req-empty">
    <i class="pi pi-search" aria-hidden="true"></i>
    <span>{{ 'portal.generic.results-not-found' | translate }}</span>
  </div>
} @else {
  <app-object-trigger-form
    [form]="form"
    [categorias]="categorias"
    [webhooks]="webhooks"
    [carregando]="carregando"
    [somenteLeitura]="!editando"
  />
}
