<header class="page-header">
  <h1 class="page-header__title">{{ 'portal.generic.label.new-trigger' | translate }}</h1>

  <div class="page-header__actions">
    <button
      pButton
      type="button"
      class="btn--md btn--secondary"
      [label]="'portal.generic.button.cancel' | translate"
      (click)="cancelar()"
    ></button>

    <button
      pButton
      type="button"
      class="btn--md btn--primary"
      [label]="'portal.generic.button.create' | translate"
      [loading]="salvando"
      [disabled]="!podeCriar || salvando"
      (click)="criar()"
    ></button>
  </div>
</header>

<app-object-trigger-fields
  [form]="form"
  [categorias]="categorias"
  [webhooks]="webhooks"
  [placeholders]="placeholders"
  [carregando]="carregando"
/>
