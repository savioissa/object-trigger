<aside class="card-container-default-basic-layout overflow-hidden">
  <header class="flex align-items-center justify-content-between gap-3 px-3 pt-3 pb-1">
    <h3 class="medium m-0">{{ 'portal.generic.label.available-placeholders' | translate }}</h3>
    <button
      pButton
      type="button"
      icon="pi pi-times"
      class="btn--md btn--neutral flex-shrink-0"
      (click)="fechar.emit()"
    ></button>
  </header>

  <p-tabView styleClass="req-tabs">
    @for (grupo of grupos; track grupo.id) {
      <p-tabPanel [header]="grupo.label">
        <ul class="list-none m-0 p-0 pb-2">
          @for (item of grupo.itens; track item.chave) {
            <li class="flex align-items-center justify-content-between gap-3 px-3 py-2 hover:surface-50">
              <div class="flex flex-column gap-1 min-w-0">
                <span class="card-input overflow-hidden text-overflow-ellipsis white-space-nowrap">{{ item.label }}</span>
                <code class="painel__token overflow-hidden text-overflow-ellipsis white-space-nowrap select-all">{{ item.token }}</code>
              </div>
              <button
                pButton
                type="button"
                icon="pi pi-copy"
                class="btn--md btn--neutral flex-shrink-0"
                (click)="copiar(item)"
              ></button>
            </li>
          }
        </ul>
      </p-tabPanel>
    }
  </p-tabView>
</aside>
